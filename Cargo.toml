[package]
description = "JWT exchange with MongoDB"
edition = "2024"
exclude = ["*.iml"]
homepage = "https://github.com/wdonne/mongo-jwt-claims"
keywords = ["claims", "jwt", "mongodb"]
license = "BSD-2-Clause"
name = "mongo-jwt-claims"
readme = "README.md"
repository = "https://github.com/wdonne/mongo-jwt-claims"
version = "1.1.1"

[dependencies]
anyhow = "1.0.104"
bson = { version = "3.1.0", features = ["serde", "serde_json-1"] }
clap = { version = "4.6.7", features = ["derive"] }
config = "0.15.27"
config-util = "1.0.0"
immutable-json = { version = "1.5.0", features = ["bson"] }
iter-util = "1.0.0"
jsonwebtoken = "11.1.0"
log = "0.4.34"
mongodb = { version = "3.9.1", features = ["aws-auth", "bson-3"] }
multimap = "0.10.1"
opentelemetry = "0.33.1"
opentelemetry_sdk = "0.33.1"
otel-config = "1.0.4"
reqwest = "0.13.5"
rustls = { version = "0.23.46", features = ["ring"] }
salvo = { version = "1.0.1", features = ["affix-state"] }
salvo-from-config = "1.0.0"
serde = "1.0.229"
serde_json = "1.0.154"
smol = "2.0.2"
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["full"] }
