[package]
description = "JWT exchange with MongoDB"
edition = "2024"
exclude = ["*.iml"]
homepage = "https://github.com/wdonne/mongo-jwt-claims"
keywords = ["claims", "jwt", "mongodb"]
license = "BSD-2-Clause"
name = "mongo-jwt-claims"
readme = "README.md"
repository = "https://github.com/wdonne/mongo-jwt-claims"
version = "1.0.0"

[dependencies]
bson = { version = "3.1.0", features = ["serde", "serde_json-1"] }
clap = { version = "4.6.6", features = ["derive"] }
config = "0.15.25"
immutable-json = { version = "1.3.1", features = ["bson"] }
iter-util = "1.0.0"
jsonwebtoken = "10.4.0"
jwks = "0.5.3"
log = "0.4.34"
mongodb = { version = "3.9.0", features = ["aws-auth", "bson-3"] }
multimap = "0.10.1"
opentelemetry = "0.32.0"
opentelemetry_sdk = "0.32.1"
otel-config = "1.0.2"
salvo = { version = "0.96.0", features = ["affix-state", "otel"] }
serde = "1.0.229"
serde_json = "1.0.151"
smol = "2.0.2"
thiserror = "2.0.20"
tokio = { version = "1.53.1", features = ["full"] }
